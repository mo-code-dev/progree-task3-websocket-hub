<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Communication Hub</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --border-color: #334155;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --system-msg: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 320px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 18px;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .hub-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 9999px;
      background-color: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      font-weight: 600;
    }

    .status-badge.connected {
      background-color: rgba(34, 197, 94, 0.2);
      color: var(--success);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    input[type="text"], select {
      background-color: var(--bg-dark);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .users-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-top: 1px solid var(--border-color);
      padding-top: 14px;
    }

    .users-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .badge-count {
      background-color: var(--bg-hover);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--text-main);
    }

    .users-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      background-color: rgba(255, 255, 255, 0.03);
      font-size: 0.85rem;
    }

    .user-indicator {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Main Chat Panel */
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--bg-dark);
    }

    .chat-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-header h2 {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .current-user-tag {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .messages-container {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
      max-width: 75%;
      align-self: flex-start;
      word-break: break-word;
    }

    .message-card.own {
      align-self: flex-end;
      border-color: rgba(99, 102, 241, 0.4);
      background-color: #1e1b4b;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      font-size: 0.75rem;
    }

    .message-author {
      font-weight: 700;
      color: #a5b4fc;
    }

    .message-time {
      color: var(--text-muted);
    }

    .message-text {
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .system-notification {
      align-self: center;
      background-color: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: var(--system-msg);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-card);
    }

    .chat-form {
      display: flex;
      gap: 12px;
    }

    .chat-form input[type="text"] {
      flex: 1;
      padding: 12px 16px;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="hub-title">WebSocket Hub</div>
      <div id="statusBadge" class="status-badge">Offline</div>
    </div>

    <div class="form-group">
      <label for="usernameInput">Username</label>
      <input type="text" id="usernameInput" placeholder="e.g. alice" autocomplete="off" />
    </div>

    <div class="form-group">
      <label for="channelSelect">Channel</label>
      <select id="channelSelect">
        <option value="general"># general</option>
        <option value="backend"># backend</option>
        <option value="devops"># devops</option>
        <option value="random"># random</option>
      </select>
    </div>

    <button id="joinBtn" class="btn">Join / Switch Channel</button>

    <section class="users-section">
      <div class="users-header">
        <label>Active Users</label>
        <span id="userCount" class="badge-count">0</span>
      </div>
      <ul id="usersList" class="users-list">
        <li class="user-item" style="color: var(--text-muted);">No users in channel</li>
      </ul>
    </section>
  </aside>

  <main class="main-panel">
    <header class="chat-header">
      <h2 id="currentChannelHeader">Select a channel</h2>
      <div id="currentUserTag" class="current-user-tag">Not joined</div>
    </header>

    <div id="messagesContainer" class="messages-container"></div>

    <footer class="chat-footer">
      <form id="messageForm" class="chat-form">
        <input
          type="text"
          id="messageInput"
          placeholder="Join a channel to send messages..."
          disabled
          autocomplete="off"
        />
        <button type="submit" id="sendBtn" class="btn" disabled>Send</button>
      </form>
    </footer>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let currentUsername = "";
    let activeChannel = "";

    const statusBadge = document.getElementById("statusBadge");
    const usernameInput = document.getElementById("usernameInput");
    const channelSelect = document.getElementById("channelSelect");
    const joinBtn = document.getElementById("joinBtn");
    const userCount = document.getElementById("userCount");
    const usersList = document.getElementById("usersList");

    const currentChannelHeader = document.getElementById("currentChannelHeader");
    const currentUserTag = document.getElementById("currentUserTag");
    const messagesContainer = document.getElementById("messagesContainer");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");

    function formatTime(isoString) {
      try {
        const date = new Date(isoString);
        return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
      } catch {
        return "";
      }
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    socket.on("connect", () => {
      statusBadge.textContent = "Connected";
      statusBadge.classList.add("connected");
    });

    socket.on("disconnect", () => {
      statusBadge.textContent = "Offline";
      statusBadge.classList.remove("connected");
      messageInput.disabled = true;
      sendBtn.disabled = true;
    });

    socket.on("channel_joined", (data) => {
      activeChannel = data.channel;
      currentUsername = data.username;
      currentChannelHeader.textContent = `# ${data.channel}`;
      currentUserTag.textContent = `Signed in as @${data.username}`;
      messageInput.disabled = false;
      sendBtn.disabled = false;
      messageInput.placeholder = `Message #${data.channel}...`;
      messageInput.focus();
    });

    socket.on("channel_users", (users) => {
      userCount.textContent = users.length;
      usersList.innerHTML = "";
      if (users.length === 0) {
        usersList.innerHTML = '<li class="user-item" style="color: var(--text-muted);">No users in channel</li>';
        return;
      }
      users.forEach((user) => {
        const li = document.createElement("li");
        li.className = "user-item";
        const isSelf = user.username === currentUsername ? " (you)" : "";
        li.innerHTML = `
          <span class="user-indicator"></span>
          <span>${user.username}${isSelf}</span>
        `;
        usersList.appendChild(li);
      });
    });

    socket.on("receive_message", (msg) => {
      const card = document.createElement("div");
      const isOwn = msg.username === currentUsername;
      card.className = `message-card ${isOwn ? "own" : ""}`;
      card.innerHTML = `
        <div class="message-meta">
          <span class="message-author">${msg.username}${isOwn ? " (you)" : ""}</span>
          <span class="message-time">${formatTime(msg.timestamp)}</span>
        </div>
        <div class="message-text">${msg.message}</div>
      `;
      messagesContainer.appendChild(card);
      scrollToBottom();
    });

    socket.on("system_message", (msg) => {
      const notice = document.createElement("div");
      notice.className = "system-notification";
      notice.innerHTML = `<span>⚡</span> <span>${msg.message}</span> <span style="opacity: 0.6; font-size: 0.7rem;">${formatTime(msg.timestamp)}</span>`;
      messagesContainer.appendChild(notice);
      scrollToBottom();
    });

    socket.on("error_message", (err) => {
      alert(err.message || "An error occurred");
    });

    joinBtn.addEventListener("click", () => {
      const username = usernameInput.value.trim();
      const channel = channelSelect.value;
      if (!username) {
        alert("Please enter a username");
        return;
      }
      socket.emit("join_channel", { username, channel });
    });

    messageForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const message = messageInput.value.trim();
      if (!message) return;
      socket.emit("send_message", { message });
      messageInput.value = "";
    });
  </script>
</body>
</html>
